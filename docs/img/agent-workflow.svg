<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 780" width="1340" height="780" role="img" aria-label="Ask agent workflow: question flows through the FastAPI endpoint into a bounded LLM tool-routing loop over seven grounded tools backed by services and Postgres, then a structured finalize pass with schema and citation guards produces a typed FinalAnswer with citations and a tool trace.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#868D96"/>
    </marker>
    <style>
      text { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #ECEDEF; }
      .mono { font-family: 'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
      .muted { fill: #A8ADB5; }
      .box { fill: #1B1E22; stroke: #2A2E34; stroke-width: 1; }
      .container { fill: #131518; stroke: #2A2E34; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .chip { fill: #0C0D0F; stroke: #2A2E34; stroke-width: 1.2; }
      .flow { stroke: #868D96; stroke-width: 1.6; fill: none; }
      .step { fill: #0C0D0F; stroke-width: 1.6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1340" height="780" rx="16" fill="#0C0D0F"/>

  <!-- header -->
  <text x="48" y="52" font-size="21" font-weight="650">Ask — grounded Q&amp;A agent workflow</text>
  <text x="48" y="76" font-size="12.5" class="muted">POST /api/ask → bounded tool-routing loop → validated, cited answer&#160;&#160;·&#160;&#160;backend/src/tracker/agent/</text>

  <!-- 1. client -->
  <rect x="48" y="150" width="160" height="120" rx="10" class="box"/>
  <rect x="48" y="150" width="3" height="120" rx="1.5" fill="#6E9BF0"/>
  <text x="68" y="182" font-size="13.5" font-weight="600">User</text>
  <text x="68" y="208" font-size="11.5" class="muted">question</text>
  <text x="68" y="226" font-size="11.5" class="muted">+ chat history</text>

  <!-- 2. api -->
  <rect x="252" y="150" width="176" height="120" rx="10" class="box"/>
  <rect x="252" y="150" width="3" height="120" rx="1.5" fill="#6E9BF0"/>
  <text x="272" y="182" font-size="13.5" font-weight="600" fill="#6E9BF0">FastAPI /api/ask</text>
  <text x="272" y="208" font-size="11.5" class="muted">thin route over the loop</text>
  <text x="272" y="226" font-size="11.5" class="muted">wall-clock time budget</text>
  <text x="272" y="244" font-size="11.5" class="muted">frozen response contract</text>

  <!-- agent loop container -->
  <rect x="472" y="110" width="430" height="406" rx="12" class="container"/>
  <rect x="492" y="98" width="214" height="24" rx="12" class="chip"/>
  <text x="599" y="114" font-size="10" letter-spacing="1" text-anchor="middle" class="muted">AGENT LOOP · ≤ 5 TOOL TURNS</text>

  <!-- llm router -->
  <rect x="496" y="156" width="382" height="88" rx="10" class="box"/>
  <rect x="496" y="156" width="3" height="88" rx="1.5" fill="#E0A64E"/>
  <text x="518" y="184" font-size="13.5" font-weight="600" fill="#E0A64E">LLM router · Chat Completions</text>
  <text x="518" y="206" font-size="11.5" class="muted">each turn: call tools, answer, clarify, or refuse</text>
  <text x="518" y="224" font-size="11.5" class="muted">system prompt scopes universe + refusal rules</text>

  <!-- router <-> tools arrows -->
  <line x1="540" y1="244" x2="540" y2="298" class="flow" marker-end="url(#arrow)"/>
  <line x1="834" y1="300" x2="834" y2="246" class="flow" marker-end="url(#arrow)"/>
  <text x="687" y="268" font-size="10.5" text-anchor="middle" class="muted">validated tool calls ↓ · JSON results ↑</text>
  <text x="687" y="284" font-size="10.5" text-anchor="middle" class="muted">fiscal labels + provenance on every result</text>

  <!-- tool registry -->
  <rect x="496" y="300" width="382" height="150" rx="10" class="box"/>
  <rect x="496" y="300" width="3" height="150" rx="1.5" fill="#2DB6A6"/>
  <text x="518" y="326" font-size="12.5" font-weight="600" fill="#2DB6A6">7 grounded tools — Pydantic-checked args</text>
  <text x="518" y="352" font-size="11.5" class="mono">get_fundamentals</text>
  <text x="518" y="372" font-size="11.5" class="mono">compare_companies</text>
  <text x="518" y="392" font-size="11.5" class="mono">get_valuation</text>
  <text x="518" y="412" font-size="11.5" class="mono">search_filings</text>
  <text x="700" y="352" font-size="11.5" class="mono">diff_risk_factors</text>
  <text x="700" y="372" font-size="11.5" class="mono">get_insider_activity</text>
  <text x="700" y="392" font-size="11.5" class="mono">list_universe</text>

  <text x="496" y="478" font-size="11" class="muted">↻&#160; 0-hit search → one corrective keyword-retry nudge</text>
  <text x="496" y="496" font-size="11" class="muted">tool errors return as readable data — the loop never raises</text>

  <!-- ready-to-answer arrow -->
  <line x1="902" y1="200" x2="964" y2="200" class="flow" marker-end="url(#arrow)"/>
  <text x="933" y="222" font-size="10.5" text-anchor="middle" class="muted">no more</text>
  <text x="933" y="236" font-size="10.5" text-anchor="middle" class="muted">tool calls</text>

  <!-- flow arrows: client -> api -> loop -->
  <line x1="208" y1="210" x2="250" y2="210" class="flow" marker-end="url(#arrow)"/>
  <line x1="428" y1="210" x2="470" y2="210" class="flow" marker-end="url(#arrow)"/>

  <!-- finalize container -->
  <rect x="966" y="110" width="310" height="406" rx="12" class="container"/>
  <rect x="996" y="98" width="224" height="24" rx="12" class="chip"/>
  <text x="1108" y="114" font-size="10" letter-spacing="1" text-anchor="middle" class="muted">FINALIZE · STRUCTURED OUTPUT</text>

  <rect x="982" y="156" width="278" height="76" rx="10" class="box"/>
  <rect x="982" y="156" width="3" height="76" rx="1.5" fill="#D98E3C"/>
  <text x="1002" y="184" font-size="12" font-weight="600" class="mono" fill="#D98E3C">response_format: json_schema</text>
  <text x="1002" y="208" font-size="11.5" class="muted">the final turn binds the answer schema</text>

  <line x1="1121" y1="232" x2="1121" y2="256" class="flow" marker-end="url(#arrow)"/>

  <rect x="982" y="258" width="278" height="76" rx="10" class="box"/>
  <rect x="982" y="258" width="3" height="76" rx="1.5" fill="#D98E3C"/>
  <text x="1002" y="286" font-size="12.5" font-weight="600" fill="#D98E3C">schema guard</text>
  <text x="1002" y="308" font-size="11.5" class="muted">Pydantic validation, extra fields rejected</text>
  <text x="1002" y="326" font-size="11.5" class="muted">invalid JSON → one corrective retry</text>

  <line x1="1121" y1="334" x2="1121" y2="358" class="flow" marker-end="url(#arrow)"/>

  <rect x="982" y="360" width="278" height="100" rx="10" class="box"/>
  <rect x="982" y="360" width="3" height="100" rx="1.5" fill="#D98E3C"/>
  <text x="1002" y="388" font-size="12.5" font-weight="600" fill="#D98E3C">citation guard</text>
  <text x="1002" y="410" font-size="11.5" class="muted">filing / fundamentals / price grounded</text>
  <text x="1002" y="428" font-size="11.5" class="muted">⇒ matching citation required</text>
  <text x="1002" y="446" font-size="11.5" class="muted">missing or uncited figures → one retry</text>

  <text x="982" y="492" font-size="11" class="muted">worst case bounded: 3 LLM calls in finalize</text>

  <!-- data layer -->
  <rect x="472" y="570" width="430" height="120" rx="10" class="box"/>
  <rect x="472" y="570" width="3" height="120" rx="1.5" fill="#2DB6A6"/>
  <text x="494" y="596" font-size="10" letter-spacing="1" fill="#2DB6A6">DATA LAYER</text>
  <text x="494" y="618" font-size="12.5" font-weight="600">services/ → Postgres (read-only here)</text>
  <text x="494" y="642" font-size="11.5" class="muted">SEC EDGAR XBRL fundamentals · 10-K chunks (Items 1A &amp; 7)</text>
  <text x="494" y="660" font-size="11.5" class="muted">Form 4 insider transactions · daily close prices</text>
  <text x="494" y="680" font-size="11" class="muted">same pure functions the REST API reads — no HTTP hop</text>

  <line x1="687" y1="516" x2="687" y2="568" class="flow" marker-end="url(#arrow)"/>
  <text x="700" y="546" font-size="10.5" class="muted">direct in-process function calls</text>

  <!-- final answer -->
  <rect x="966" y="570" width="310" height="120" rx="10" class="box"/>
  <rect x="966" y="570" width="3" height="120" rx="1.5" fill="#A78BFA"/>
  <text x="988" y="596" font-size="10" letter-spacing="1" fill="#A78BFA">RESPONSE</text>
  <text x="988" y="618" font-size="13.5" font-weight="600" fill="#A78BFA">FinalAnswer</text>
  <text x="988" y="640" font-size="11.5" class="mono">answer_md · citations[] · trace</text>
  <text x="988" y="658" font-size="11.5" class="muted">kind: answer | clarification | decline | error</text>
  <text x="988" y="678" font-size="11" class="muted">failures degrade to a typed decline — never raises</text>

  <line x1="1121" y1="516" x2="1121" y2="568" class="flow" marker-end="url(#arrow)"/>
  <text x="1134" y="546" font-size="10.5" class="muted">validated, cited JSON</text>

  <!-- return path to client -->
  <path d="M 1121 690 V 728 H 128 V 276" class="flow" marker-end="url(#arrow)"/>
  <text x="624" y="718" font-size="10.5" text-anchor="middle" class="muted">cited answer + tool trace, rendered in the Ask side panel</text>

  <!-- step badges -->
  <g font-size="11" font-weight="650" text-anchor="middle">
    <circle cx="229" cy="210" r="10" class="step" stroke="#6E9BF0"/>
    <text x="229" y="214" fill="#6E9BF0">1</text>
    <circle cx="496" cy="156" r="10" class="step" stroke="#E0A64E"/>
    <text x="496" y="160" fill="#E0A64E">2</text>
    <circle cx="496" cy="300" r="10" class="step" stroke="#2DB6A6"/>
    <text x="496" y="304" fill="#2DB6A6">3</text>
    <circle cx="966" cy="110" r="10" class="step" stroke="#D98E3C"/>
    <text x="966" y="114" fill="#D98E3C">4</text>
    <circle cx="966" cy="570" r="10" class="step" stroke="#A78BFA"/>
    <text x="966" y="574" fill="#A78BFA">5</text>
  </g>

  <text x="1276" y="762" font-size="10.5" text-anchor="end" class="muted">backend/src/tracker/agent — loop.py · tools.py · prompts.py</text>
</svg>
